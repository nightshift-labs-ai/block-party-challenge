name = "extriver-proto"
main = "src/worker.js"
compatibility_date = "2026-10-01"
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health"]
[[kv_namespaces]]
binding = "SCORES"
id = "ff4533d79ded4f14a4a28128b7e08df5"

[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Board"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "DAILY"
class_name = "Daily"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Daily"]
