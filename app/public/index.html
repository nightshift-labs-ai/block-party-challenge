<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Block Party Challenge · 블록 파티 챌린지</title>
<meta name="description" content="A party game for a big screen: everyone plays on their phone. Telepathy, greed and find-the-diamond rounds.">
<style>
:root{--bg:#1b1f2a;--panel:#2a3142;--grass:#5bbf3a;--dirt:#8b5a2b;--gold:#ffcf3f;--dia:#4fe3e3;--red:#e5484d;--txt:#f4f4f4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font:600 18px/1.35 "Trebuchet MS","Noto Sans KR",system-ui,sans-serif;
 background-image:linear-gradient(45deg,#ffffff06 25%,transparent 25%,transparent 75%,#ffffff06 75%),linear-gradient(45deg,#ffffff06 25%,transparent 25%,transparent 75%,#ffffff06 75%);background-size:48px 48px;background-position:0 0,24px 24px}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
h1{font-size:clamp(28px,5vw,56px);margin:.2em 0;text-shadow:4px 4px 0 #000;letter-spacing:1px}
.ko{opacity:.75;font-size:.8em}
.btn{display:inline-block;border:0;cursor:pointer;font:inherit;color:#111;background:var(--grass);padding:14px 22px;margin:6px;box-shadow:inset -4px -4px 0 #0005,inset 4px 4px 0 #fff5;min-width:150px}
.btn.alt{background:var(--gold)}.btn.red{background:var(--red);color:#fff}
.btn:active{transform:translateY(2px)}
.panel{background:var(--panel);padding:18px;margin:12px 0;box-shadow:inset -4px -4px 0 #0004,inset 4px 4px 0 #fff1}
input{font:inherit;padding:12px;width:100%;margin:6px 0;border:0;background:#111;color:#fff;text-transform:none}
.code{font-size:clamp(48px,10vw,120px);letter-spacing:12px;color:var(--gold);text-shadow:5px 5px 0 #000}
.players{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:#0004;padding:8px 12px}.chip.off{opacity:.4}.chip.done{outline:3px solid var(--grass)}.brand{background:linear-gradient(90deg,#f2c94c33,#5bbf3a33);border:2px solid var(--gold);padding:6px 12px;margin-bottom:8px}.chip.bust{text-decoration:line-through;opacity:.55;outline:3px solid var(--red)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font-size:clamp(18px,3vw,30px);padding:22px;background:#0005;text-align:center;position:relative}
.opt .bar{position:absolute;left:0;bottom:0;height:6px;background:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:460px;margin:auto}
.cell{aspect-ratio:1;background:var(--dirt);border:0;box-shadow:inset -5px -5px 0 #0005,inset 5px 5px 0 #fff3;font-size:22px;color:#fff;cursor:pointer}
.cell.top{background:linear-gradient(var(--grass) 30%,var(--dirt) 30%)}
.cell.dia{background:var(--dia)}.cell.lava{background:radial-gradient(#ffb400,#e5484d 70%);color:#000}.cell.pick{outline:4px solid var(--gold)}
.timer{height:14px;background:#0006;margin:10px 0}.timer i{display:block;height:100%;background:var(--gold);transition:width .25s linear}
.big{font-size:clamp(24px,4vw,44px)}
table{width:100%;border-collapse:collapse}td{padding:8px;border-bottom:2px solid #0004}
.hide{display:none}.center{text-align:center}
.slider{width:100%}
small{opacity:.7}
.btn.opt{color:#111;margin:0;min-width:0;font-size:20px;padding:18px 8px}.btn.opt .ko{opacity:.8}
.btn.opt:nth-child(1){background:#5bbf3a}.btn.opt:nth-child(2){background:#4fb3e3}.btn.opt:nth-child(3){background:#ffcf3f}.btn.opt:nth-child(4){background:#ff8a5c}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}@media (max-width:800px){.cols{grid-template-columns:1fr}}
h1.big{font-size:clamp(22px,3vw,36px)}.grid{max-width:min(460px,60vh)}
.qr{background:#fff;padding:10px;display:inline-block;margin-top:10px}.qr svg{display:block;width:220px;height:220px}
html.overlay,html.overlay body{background:transparent!important;background-image:none!important}
html.overlay .wrap{max-width:none;padding:10px 16px}
html.overlay .panel{background:#000b}
html.overlay body{text-shadow:0 0 3px #000,2px 2px 0 #000}
html.overlay h1,html.overlay p.big,html.overlay small{background:#000b;padding:6px 12px;display:inline-block}
html.overlay h1{font-size:clamp(20px,2.6vw,34px)}
html.overlay .code{font-size:64px;letter-spacing:6px}
html.overlay .qr svg{width:150px;height:150px}
html.overlay .opt{background:#000b}
html.overlay .grid{max-width:min(380px,50vh)}
.keys{opacity:.6;font-size:13px;margin-left:8px}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.pop .opt,.pop .cell,.pop p.big{animation:pop .45s ease-out both}
.pop .cell:nth-child(1){animation-delay:0ms}.pop .cell:nth-child(2){animation-delay:25ms}.pop .cell:nth-child(3){animation-delay:50ms}.pop .cell:nth-child(4){animation-delay:75ms}.pop .cell:nth-child(5){animation-delay:100ms}.pop .cell:nth-child(6){animation-delay:125ms}.pop .cell:nth-child(7){animation-delay:150ms}.pop .cell:nth-child(8){animation-delay:175ms}.pop .cell:nth-child(9){animation-delay:200ms}.pop .cell:nth-child(10){animation-delay:225ms}.pop .cell:nth-child(11){animation-delay:250ms}.pop .cell:nth-child(12){animation-delay:275ms}.pop .cell:nth-child(13){animation-delay:300ms}.pop .cell:nth-child(14){animation-delay:325ms}.pop .cell:nth-child(15){animation-delay:350ms}.pop .cell:nth-child(16){animation-delay:375ms}.pop .cell:nth-child(17){animation-delay:400ms}.pop .cell:nth-child(18){animation-delay:425ms}.pop .cell:nth-child(19){animation-delay:450ms}.pop .cell:nth-child(20){animation-delay:475ms}.pop .cell:nth-child(21){animation-delay:500ms}.pop .cell:nth-child(22){animation-delay:525ms}.pop .cell:nth-child(23){animation-delay:550ms}.pop .cell:nth-child(24){animation-delay:575ms}.pop .cell:nth-child(25){animation-delay:600ms}
.pop .opt:nth-child(2){animation-delay:.1s}.pop .opt:nth-child(3){animation-delay:.2s}.pop .opt:nth-child(4){animation-delay:.3s}
.pop .opt .bar{transition:width .8s ease-out .4s}
@media (prefers-reduced-motion:reduce){.pop *{animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="/vendor/qrcode.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
