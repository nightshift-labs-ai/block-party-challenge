<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Block Party Challenge · 블록 파티 챌린지</title>
<meta name="description" content="A party game for a big screen: everyone plays on their phone. Telepathy, greed and find-the-diamond rounds.">
<style>
:root{--bg:#1b1f2a;--panel:#2a3142;--grass:#5bbf3a;--dirt:#8b5a2b;--gold:#ffcf3f;--dia:#4fe3e3;--red:#e5484d;--txt:#f4f4f4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font:600 18px/1.35 "Trebuchet MS","Noto Sans KR",system-ui,sans-serif;
 background-image:linear-gradient(45deg,#ffffff06 25%,transparent 25%,transparent 75%,#ffffff06 75%),linear-gradient(45deg,#ffffff06 25%,transparent 25%,transparent 75%,#ffffff06 75%);background-size:48px 48px;background-position:0 0,24px 24px}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
h1{font-size:clamp(28px,5vw,56px);margin:.2em 0;text-shadow:4px 4px 0 #000;letter-spacing:1px}
.ko{opacity:.75;font-size:.8em}
.btn{display:inline-block;border:0;cursor:pointer;font:inherit;color:#111;background:var(--grass);padding:14px 22px;margin:6px;box-shadow:inset -4px -4px 0 #0005,inset 4px 4px 0 #fff5;min-width:150px}
.btn.alt{background:var(--gold)}.btn.red{background:var(--red);color:#fff}
.btn:active{transform:translateY(2px)}
.panel{background:var(--panel);padding:18px;margin:12px 0;box-shadow:inset -4px -4px 0 #0004,inset 4px 4px 0 #fff1}
input{font:inherit;padding:12px;width:100%;margin:6px 0;border:0;background:#111;color:#fff;text-transform:none}
.code{font-size:clamp(48px,10vw,120px);letter-spacing:12px;color:var(--gold);text-shadow:5px 5px 0 #000}
.players{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:#0004;padding:8px 12px}.chip.off{opacity:.4}.chip.done{outline:3px solid var(--grass)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font-size:clamp(18px,3vw,30px);padding:22px;background:#0005;text-align:center;position:relative}
.opt .bar{position:absolute;left:0;bottom:0;height:6px;background:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:460px;margin:auto}
.cell{aspect-ratio:1;background:var(--dirt);border:0;box-shadow:inset -5px -5px 0 #0005,inset 5px 5px 0 #fff3;font-size:22px;color:#fff;cursor:pointer}
.cell.top{background:linear-gradient(var(--grass) 30%,var(--dirt) 30%)}
.cell.dia{background:var(--dia)}.cell.lava{background:radial-gradient(#ffb400,#e5484d 70%);color:#000}.cell.pick{outline:4px solid var(--gold)}
.timer{height:14px;background:#0006;margin:10px 0}.timer i{display:block;height:100%;background:var(--gold);transition:width .25s linear}
.big{font-size:clamp(24px,4vw,44px)}
table{width:100%;border-collapse:collapse}td{padding:8px;border-bottom:2px solid #0004}
.hide{display:none}.center{text-align:center}
.slider{width:100%}
small{opacity:.7}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}@media (max-width:800px){.cols{grid-template-columns:1fr}}
h1.big{font-size:clamp(22px,3vw,36px)}.grid{max-width:min(460px,60vh)}
.qr{background:#fff;padding:10px;display:inline-block;margin-top:10px}.qr svg{display:block;width:220px;height:220px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="/vendor/qrcode.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
