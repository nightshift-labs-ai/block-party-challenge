# CI/CD: unit tests on every push/PR; on main → deploy to Cloudflare, then smoke-test production and roll back automatically if it fails.
name: ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      URL: https://extriver-proto.nightshift-labs.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Remember the live version (for rollback)
        run: npx -y wrangler@4 deployments list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s);console.log("PREV="+d[d.length-1].versions[0].version_id)})' >> "$GITHUB_ENV"
      - run: npx -y wrangler@4 deploy
      - name: Smoke test production (health + full 3-player episode over WebSocket)
        id: smoke
        run: curl -fsS "$URL/health" && node test/room-e2e.mjs "$URL"
      - name: Roll back on failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: npx -y wrangler@4 rollback "$PREV" -y -m "auto-rollback: smoke test failed"
